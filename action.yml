name: "JSON Deep Path Reader"
description: "Read a safe dotted own-property path from JSON and fail cleanly when any segment is missing."
inputs:
  payload:
    description: "JSON payload consumed by the action"
    required: true
outputs:
  result:
    description: "Compact JSON result produced by the action"
runs:
  using: "node24"
  main: "index.js"
branding:
  icon: "check-circle"
  color: "blue"
